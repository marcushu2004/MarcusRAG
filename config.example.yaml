# Copy to config.yaml — config.yaml is never read implicitly from the package.
# Every key can also be overridden per-run on the CLI (see `python -m marcusrag ask -h`).

# --- corpus ---------------------------------------------------------------
data_dir: data/pdfs            # where your PDF / TXT / MD files live
index_root: index              # index/<embedding-model>/<store>/ is created under it

# --- chunking -------------------------------------------------------------
profile: zh                    # en | zh; picks default chunk sizes and the prompt language
chunk_size: 400                # characters per chunk (must stay under the model token limit)
chunk_overlap: 80              # must be smaller than chunk_size

# --- embeddings -----------------------------------------------------------
embedder: hf                   # hf (sentence-transformers, needs torch) | hash (offline demo)
embedding_model: BAAI/bge-small-zh-v1.5
embedding_batch_size: 32

# --- vector store ---------------------------------------------------------
store: chroma                  # chroma (persistent) | memory (JSON, for tests/demos)

# --- retrieval ------------------------------------------------------------
search_type: hybrid            # hybrid (BM25 + vector, RRF) | mmr | similarity
top_k: 4                       # evidence chunks handed to the generator
fetch_k: 20                    # candidates pulled before reranking
mmr_lambda: 0.5                # only for search_type=mmr

# Reciprocal-rank fusion weights and damping (search_type=hybrid)
hybrid_vector_weight: 1.0
hybrid_bm25_weight: 1.0
rrf_k: 60

# Reranking of the fetch_k candidates: none | lexical | cross-encoder
rerank: lexical
rerank_model: BAAI/bge-reranker-base      # only for rerank=cross-encoder
rerank_base_weight: 0.7        # 0 = pure rerank score, 1 = keep the first-stage order

# --- generation -----------------------------------------------------------
llm_backend: ollama            # ollama | openai (any OpenAI-compatible API) | fake (stub for tests)
llm_model: qwen2.5:3b
# ollama -> http://127.0.0.1:11434 ; openai -> https://api.deepseek.com/v1
# (Ollama's own OpenAI shim is http://127.0.0.1:11434/v1)
llm_base_url: http://127.0.0.1:11434
# Never commit a real key: export MARCUSRAG_API_KEY instead. Local servers keep this empty.
llm_api_key: ""
temperature: 0.0
request_timeout: 120.0
max_context_chars: 8000        # evidence budget in the prompt; the drop is reported, not silent

# --- answer safety --------------------------------------------------------
refuse_when_empty: true        # say "not in the documents" instead of guessing
verify_citations: true         # citations must point at a chunk retrieved for this question
